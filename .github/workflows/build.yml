name: ZMK Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "hardware/**"
      - "keymap-drawer/config.yaml"
      - "nix/**"
      - "scripts/check-config.sh"
      - "build.yaml"
      - "Justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "hardware/**"
      - "keymap-drawer/config.yaml"
      - "nix/**"
      - "scripts/check-config.sh"
      - "build.yaml"
      - "Justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zmk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31

      - name: Cache west workspace
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            .west
            zmk
            zephyr
            modules
            optional
            ergonautkb-zmk-module
          key: west-workspace-${{ hashFiles('config/west.yml', 'flake.lock') }}
          restore-keys: |
            west-workspace-${{ hashFiles('config/west.yml') }}-
            west-workspace-

      - name: Initialize ZMK workspace
        run: |
          if [ ! -d .west ] || [ ! -d zmk ]; then
            nix develop --command just init
          else
            nix develop --command bash -lc 'west update --fetch-opt=--filter=blob:none && west zephyr-export'
          fi

      - name: Check configuration invariants
        run: nix develop --command just check

      - name: Build firmware
        run: nix develop --command just build all -p

      - name: Generate keymap drawings
        run: nix develop --command just draw all

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zmk-firmware-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload keymap drawings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: keymap-drawings
          path: keymap-drawer/
          if-no-files-found: error
          retention-days: 1

  commit-drawings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download keymap drawings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: keymap-drawings
          path: keymap-drawer

      - name: Commit keymap drawings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/
          if ! git diff --cached --quiet; then
            git commit -m "Update keymap drawings [skip ci]"
            git push
          fi
