name: ZMK Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "hardware/**"
      - "keymap-drawer/config.yaml"
      - "nix/**"
      - "scripts/check-config.sh"
      - "build.yaml"
      - "Justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "hardware/**"
      - "keymap-drawer/config.yaml"
      - "nix/**"
      - "scripts/check-config.sh"
      - "build.yaml"
      - "Justfile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zmk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31

      - name: Cache west workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            .west
            zmk
            zephyr
            modules
            optional
            ergonautkb-zmk-module
          key: west-workspace-${{ hashFiles('config/west.yml', 'flake.lock') }}
          restore-keys: |
            west-workspace-${{ hashFiles('config/west.yml') }}-
            west-workspace-

      - name: Initialize ZMK workspace
        run: |
          if [ ! -d .west ] || [ ! -d zmk ]; then
            nix develop --command just init
          else
            nix develop --command bash -lc 'west update --fetch-opt=--filter=blob:none && west zephyr-export'
          fi

      - name: Check configuration invariants
        run: nix develop --command just check

      - name: Build firmware
        run: nix develop --command just build all -p

      - name: Generate keymap drawings
        run: nix develop --command just draw all

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: zmk-firmware-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload keymap drawings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: keymap-drawings
          path: keymap-drawer/
          if-no-files-found: error
          retention-days: 1

  commit-drawings:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download keymap drawings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: keymap-drawings
          path: keymap-drawer

      - name: Commit keymap drawings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add keymap-drawer/
          if ! git diff --cached --quiet; then
            git commit -m "Update keymap drawings [skip ci]"
            git push
          fi
